name: arXiv Header Probe

on:
  push:
    branches: ['claude/github-actions-failures-*']
    paths: ['.github/workflows/arxiv-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Isolate query complexity vs max_results
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, time

          UA = "awesome-embodied-ai-digest/2.1 (+https://github.com/jonstephens85/awesome-embodied-ai)"
          KW = "egocentric video"
          SIMPLE  = f'all:"{KW}"'
          MEDIUM  = f'(ti:"{KW}" OR abs:"{KW}")'
          COMPLEX = f'(ti:"{KW}" OR abs:"{KW}") AND (cat:cs.RO OR cat:cs.CV OR cat:cs.LG OR cat:cs.AI)'

          def hit(q, n, sort=True):
              P = {"search_query": q, "start": 0, "max_results": n}
              if sort:
                  P["sortBy"] = "submittedDate"; P["sortOrder"] = "descending"
              url = "https://export.arxiv.org/api/query?" + urllib.parse.urlencode(P)
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(url, headers={"User-Agent": UA}), timeout=45) as r:
                      return f"200 ({len(r.read())}b)"
              except urllib.error.HTTPError as e:
                  return f"{e.code}"
              except Exception as e:
                  return type(e).__name__

          print("=== 2x2: query complexity x max_results (each run twice) ===")
          for label, q in [("simple ", SIMPLE), ("medium ", MEDIUM), ("complex", COMPLEX)]:
              for n in (2, 25, 50, 100):
                  a = hit(q, n); time.sleep(4)
                  b = hit(q, n); time.sleep(4)
                  print(f"  {label} max_results={n:<4} -> {a:<12} {b}", flush=True)

          print("\n=== does sortBy matter? (complex query) ===")
          for n in (2, 100):
              print(f"  complex max_results={n:<4} no-sort -> {hit(COMPLEX, n, sort=False)}", flush=True)
              time.sleep(4)

          print("\n=== exact digest query at PAGE_SIZE=100 vs smaller ===")
          for n in (100, 75, 50, 30, 20, 10):
              print(f"  digest-shaped max_results={n:<4} -> {hit(COMPLEX, n)}", flush=True)
              time.sleep(4)
          PY
