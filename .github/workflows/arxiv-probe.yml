name: arXiv Header Probe

on:
  push:
    branches: ['claude/github-actions-failures-*']
    paths: ['.github/workflows/arxiv-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Isolate why urllib is rejected but curl is not
        run: |
          pip install -q requests
          python - <<'PY'
          import http.client, urllib.parse, urllib.request, urllib.error
          import subprocess, time, gzip

          P = {"search_query":'all:"egocentric video"',"sortBy":"submittedDate",
               "sortOrder":"descending","start":0,"max_results":2}
          PATH = "/api/query?" + urllib.parse.urlencode(P)
          URL = "https://export.arxiv.org" + PATH
          UA = "awesome-embodied-ai-digest/2.1 (+https://github.com/jonstephens85/awesome-embodied-ai)"

          def show(name, fn):
              try:
                  print(f"{name:<44} {fn()}")
              except Exception as e:
                  print(f"{name:<44} {type(e).__name__}: {e}")
              time.sleep(3)

          # 1. what urllib actually puts on the wire
          r = urllib.request.Request(URL, headers={"User-Agent": UA, "Accept": "application/atom+xml"})
          print("urllib header casing on wire:", dict(r.header_items()))
          print()

          # 2. http.client with EXACT header casing (stdlib, no urllib rewriting)
          def exact_case():
              c = http.client.HTTPSConnection("export.arxiv.org", timeout=40)
              c.putrequest("GET", PATH, skip_host=True, skip_accept_encoding=True)
              c.putheader("Host", "export.arxiv.org")
              c.putheader("User-Agent", UA)
              c.putheader("Accept", "application/atom+xml,application/xml;q=0.9,*/*;q=0.8")
              c.putheader("Accept-Encoding", "gzip, deflate")
              c.putheader("Connection", "keep-alive")
              c.endheaders()
              resp = c.getresponse(); body = resp.read(); c.close()
              return f"HTTP {resp.status} bytes={len(body)}"
          show("A http.client exact casing", exact_case)

          # 3. http.client mimicking urllib's capitalize() casing
          def urllib_case():
              c = http.client.HTTPSConnection("export.arxiv.org", timeout=40)
              c.putrequest("GET", PATH, skip_host=True, skip_accept_encoding=True)
              c.putheader("Host", "export.arxiv.org")
              c.putheader("User-agent", UA)
              c.putheader("Accept-encoding", "identity")
              c.putheader("Connection", "close")
              c.endheaders()
              resp = c.getresponse(); body = resp.read(); c.close()
              return f"HTTP {resp.status} bytes={len(body)}"
          show("B http.client urllib-style casing", urllib_case)

          # 4. requests
          import requests
          show("C requests default UA",
               lambda: f"HTTP {requests.get(URL, timeout=40).status_code}")
          show("D requests + our UA",
               lambda: f"HTTP {requests.get(URL, headers={'User-Agent': UA}, timeout=40).status_code}")

          # 5. curl via subprocess (known good)
          def curl():
              out = subprocess.run(["curl","-s","-o","/dev/null","-w","%{http_code}",
                                    "--max-time","40","-H",f"User-Agent: {UA}", URL],
                                   capture_output=True, text=True)
              return f"HTTP {out.stdout.strip()}"
          show("E curl subprocess + our UA", curl)

          # 6. plain urllib for the record
          def plain():
              try:
                  with urllib.request.urlopen(urllib.request.Request(URL, headers={"User-Agent": UA}), timeout=40) as r:
                      return f"HTTP {r.status} bytes={len(r.read())}"
              except urllib.error.HTTPError as e:
                  return f"HTTPError {e.code} {e.reason}"
          show("F urllib (baseline)", plain)
          PY
