name: arXiv Header Probe

# Temporary diagnostic: determines which request headers arXiv accepts.
# Manual dispatch only; delete once the digest is confirmed healthy.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe arXiv with different header sets
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, time

          params = {
              "search_query": 'all:"egocentric video"',
              "sortBy": "submittedDate",
              "sortOrder": "descending",
              "start": 0,
              "max_results": 5,
          }
          url = "https://export.arxiv.org/api/query?" + urllib.parse.urlencode(params)

          OLD_UA = "arxiv-embodied-digest/2.0 (https://github.com; research paper tracking)"
          NEW_UA = "awesome-embodied-ai-digest/2.1 (+https://github.com/jonstephens85/awesome-embodied-ai)"
          ACCEPT = "application/atom+xml,application/xml;q=0.9,*/*;q=0.8"

          cases = [
              ("1. OLD: UA only, no Accept", {"User-Agent": OLD_UA}),
              ("2. OLD UA + Accept", {"User-Agent": OLD_UA, "Accept": ACCEPT}),
              ("3. NEW UA, no Accept", {"User-Agent": NEW_UA}),
              ("4. NEW full set (what we shipped)", {
                  "User-Agent": NEW_UA, "Accept": ACCEPT,
                  "Accept-Language": "en-US,en;q=0.9", "Accept-Encoding": "identity"}),
              ("5. no headers at all", {}),
          ]

          for name, h in cases:
              t = time.time()
              try:
                  req = urllib.request.Request(url, headers=h)
                  with urllib.request.urlopen(req, timeout=45) as r:
                      body = r.read()
                  print(f"{name}: HTTP {r.status} bytes={len(body)} in {time.time()-t:.1f}s")
              except urllib.error.HTTPError as e:
                  print(f"{name}: HTTPError {e.code} {e.reason} in {time.time()-t:.1f}s")
              except Exception as e:
                  print(f"{name}: {type(e).__name__}: {e} in {time.time()-t:.1f}s")
              time.sleep(3)
          PY
