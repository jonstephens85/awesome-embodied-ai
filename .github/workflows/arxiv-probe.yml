name: arXiv Header Probe

on:
  push:
    branches: ['claude/github-actions-failures-*']
    paths: ['.github/workflows/arxiv-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Characterise arXiv throttling
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, time

          UA = "awesome-embodied-ai-digest/2.1 (+https://github.com/jonstephens85/awesome-embodied-ai)"

          def hit(kw, delay_label=""):
              P = {"search_query": f'(ti:"{kw}" OR abs:"{kw}") AND (cat:cs.RO OR cat:cs.CV)',
                   "sortBy":"submittedDate","sortOrder":"descending","start":0,"max_results":100}
              url = "https://export.arxiv.org/api/query?" + urllib.parse.urlencode(P)
              t = time.time()
              try:
                  with urllib.request.urlopen(
                          urllib.request.Request(url, headers={"User-Agent": UA}), timeout=45) as r:
                      n = len(r.read())
                  return f"200 ({n}b, {time.time()-t:.1f}s)"
              except urllib.error.HTTPError as e:
                  return f"{e.code} {e.reason} ({time.time()-t:.1f}s)"
              except Exception as e:
                  return f"{type(e).__name__} ({time.time()-t:.1f}s)"

          KW = ["egocentric video","robot manipulation","vision language action",
                "world model","embodied ai","sim to real","robot policy","tactile sensing"]

          print("=== PHASE 1: digest cadence, 3s apart (mimics the real run) ===")
          for i in range(12):
              kw = KW[i % len(KW)]
              print(f"  req {i+1:2d} [{kw:<22}] -> {hit(kw)}", flush=True)
              time.sleep(3)

          print("\n=== PHASE 2: cool off 90s, then retry ===")
          time.sleep(90)
          for i in range(3):
              print(f"  post-cooldown {i+1} -> {hit(KW[i])}", flush=True)
              time.sleep(3)

          print("\n=== PHASE 3: slow cadence, 20s apart ===")
          for i in range(5):
              print(f"  slow {i+1} -> {hit(KW[i])}", flush=True)
              time.sleep(20)
          PY
